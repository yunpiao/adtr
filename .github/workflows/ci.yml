name: engineering-ci
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'docs/**']
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify dependency checksums
        run: go mod verify
      - name: Lint, race tests, type checking and build
        run: make check
      - name: Real PostgreSQL migration and schema contracts
        run: python3 scripts/test_integration.py
      - name: API and Worker lifecycle
        run: python3 scripts/test_lifecycle.py
