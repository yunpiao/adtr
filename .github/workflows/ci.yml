name: engineering-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions: {}
# setup-node, npm ci and npm audit must restore/use the same content cache.
env:
  npm_config_cache: /tmp/adtr-npm-cache
  ADTR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  ADTR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.prepare.outputs.archive_sha256 }}
      producer_attempt: ${{ steps.prepare.outputs.producer_attempt }}
      checkout_sha: ${{ steps.prepare.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the exact PostgreSQL image once
        id: prepare
        run: python3 scripts/ci_postgres_image.py produce --directory "$RUNNER_TEMP/adtr-postgres"
      - name: Share the verified public image within this run
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adtr-postgres/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  contracts:
    needs: [prepare-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify dependency checksums
        run: go mod verify
      - name: Lint, race tests, type checking and build
        run: make check
      - name: Real PostgreSQL migration and schema contracts
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_integration.py --suite non-auth
      - name: API and Worker lifecycle
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_lifecycle.py

  auth-integration:
    needs: [prepare-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify dependency checksums
        run: go mod verify
      - name: Real PostgreSQL authentication and HTTP contracts
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_integration.py --suite auth --shard ${{ matrix.shard }}

  browser:
    needs: [prepare-postgres]
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: ${{ (matrix.name == 'user-assets-v2' || matrix.name == 'user-assets-v2-readers') && 'stable-body' || 'native-finish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: user-assets-v2
            command: python3 scripts/test_auth_e2e.py --suite user-assets-v2
          - name: user-assets-v2-readers
            command: python3 scripts/test_auth_e2e.py --suite user-assets-v2-readers
          - name: directory-v2
            command: python3 scripts/test_auth_e2e.py --suite directory-v2
          - name: directory-v2-controls
            command: python3 scripts/test_auth_e2e.py --suite directory-v2-controls
          - name: directory-v2-readers
            command: python3 scripts/test_auth_e2e.py --suite directory-v2-readers
          - name: directory-readers
            command: python3 scripts/test_auth_e2e.py --suite directory-readers
          - name: authentication
            command: python3 scripts/test_auth_e2e.py
          - name: expired-password
            command: python3 scripts/test_auth_e2e.py --expired
          - name: access
            command: python3 scripts/test_auth_e2e.py --suite access
          - name: resources
            command: python3 scripts/test_auth_e2e.py --suite resource
          - name: tasks
            command: python3 scripts/test_auth_e2e.py --suite tasks
          - name: audit
            command: python3 scripts/test_auth_e2e.py --suite audit
          - name: system
            command: python3 scripts/test_auth_e2e.py --suite system
          - name: maintenance
            command: python3 scripts/test_auth_e2e.py --suite maintenance
          - name: domains
            command: python3 scripts/test_auth_e2e.py --suite domains
          - name: operations
            command: python3 scripts/test_auth_e2e.py --suite operations
          - name: profile
            command: python3 scripts/test_auth_e2e.py --suite profile
          - name: credential-use
            command: python3 scripts/test_auth_e2e.py --suite credential-use
          - name: account-references
            command: python3 scripts/test_auth_e2e.py --suite account-references
          - name: operational-logs
            command: python3 scripts/test_auth_e2e.py --suite operational-logs
          - name: session-invalidation
            command: python3 scripts/test_auth_e2e.py --suite session-invalidation
          - name: account-reference-barrier
            command: python3 scripts/test_auth_e2e.py --suite account-reference-barrier
          - name: directory
            command: python3 scripts/test_auth_e2e.py --suite directory
          - name: directory-controls
            command: python3 scripts/test_auth_e2e.py --suite directory-controls
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real API and frontend
        run: go mod verify && make build web-build
      - name: Install real browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Run isolated real browser API database acceptance
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: ${{ matrix.command }}
      - name: Retain synthetic profile visual evidence
        if: ${{ success() && matrix.name == 'profile' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/viewer-profile.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic credential source visual evidence
        if: ${{ success() && matrix.name == 'account-references' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-source-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/source-unconfigured.png
            web/test-results/**/source-reference.png
            web/test-results/**/source-custom.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic operational journal evidence
        if: ${{ success() && matrix.name == 'operational-logs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/production-journal-first-last.json
            web/test-results/**/operational-logs.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic task workspace evidence
        if: ${{ success() && matrix.name == 'tasks' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasks-soc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/tasks-soc-*
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic user asset evidence
        if: ${{ success() && (matrix.name == 'user-assets-v2' || matrix.name == 'user-assets-v2-readers') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/user-assets-v2-*
          if-no-files-found: error
          retention-days: 7
  native-no-store:
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: stable-body
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser test dependencies
        run: npm ci --prefix web --cache /tmp/adtr-npm-cache
      - name: Install pinned Chromium and headed dependencies
        run: cd web && npx playwright install --with-deps chromium
      - name: Require complete application reads and record native outcomes
        run: xvfb-run -a npm run test:e2e --prefix web -- e2e/native-no-store-completion.spec.ts --headed
      - name: Retain synthetic native stream diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-no-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/native-no-store-completion.json
          if-no-files-found: error
          retention-days: 7

  native-no-store-fixed:
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: native-finish
    # Isolated upstream-fix diagnostic; the pinned baseline and matrix stay intact.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser test dependencies
        run: npm ci --prefix web --cache /tmp/adtr-npm-cache
      - name: Install headed browser system dependencies
        run: cd web && npx playwright install-deps chromium
      - name: Verify official fixed-build diagnostic browser
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/adtr-native-fixed"
          mkdir -p "$fixture"
          archive="$fixture/chrome-linux64.zip"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 10 --max-time 180 \
            'https://storage.googleapis.com/chrome-for-testing-public/157.0.8092.0/linux64/chrome-linux64.zip' -o "$archive"
          test "$(stat -c %s "$archive")" -eq 201751736
          printf '%s  %s\n' '28d4f185c9047a91fe79ee8d31e5e0b5b858fc107129b3df361fdd095dbb2ace' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$fixture"
          chrome="$fixture/chrome-linux64/chrome"
          version="$("$chrome" --version | sed 's/[[:space:]]*$//')"
          test "$version" = 'Google Chrome for Testing 157.0.8092.0'
          printf 'ADTR_E2E_CHROMIUM_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
          {
            printf 'channel=Dev\nversion=%s\n' "$version"
            printf 'source_tag=2b9f0645d8f651a36f74683f22a3746379f13bc6\n'
            printf 'engine_fix=62473ad0f747e245e514c93e741bb8e168a2a207\n'
            sha256sum "$archive" web/e2e/native-no-store-completion.spec.ts web/e2e/native-stream-proof.ts web/e2e/user-assets-v2.spec.ts web/e2e/user-assets-v2-readers.spec.ts web/e2e/user-assets-v2-held-response.ts web/e2e/directory-v2-response-observer.ts web/src/directory-v2-json.ts
          } > "$fixture/provenance.txt"
          cat "$fixture/provenance.txt"
      - name: Require identical native stream proof on the fixed engine
        run: xvfb-run -a npm run test:e2e --prefix web -- e2e/native-no-store-completion.spec.ts --headed
      - name: Retain fixed-build synthetic diagnostics and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-no-store-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/native-no-store-completion.json
            ${{ runner.temp }}/adtr-native-fixed/provenance.txt
          if-no-files-found: error
          retention-days: 7

  user-assets-fixed:
    needs: [prepare-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: native-finish
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [user-assets-v2, user-assets-v2-readers]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real API and frontend
        run: go mod verify && make build web-build
      - name: Install browser system dependencies
        run: cd web && npx playwright install-deps chromium
      - name: Verify official fixed-build diagnostic browser
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/adtr-native-fixed"
          mkdir -p "$fixture"
          archive="$fixture/chrome-linux64.zip"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 10 --max-time 180 \
            'https://storage.googleapis.com/chrome-for-testing-public/157.0.8092.0/linux64/chrome-linux64.zip' -o "$archive"
          test "$(stat -c %s "$archive")" -eq 201751736
          printf '%s  %s\n' '28d4f185c9047a91fe79ee8d31e5e0b5b858fc107129b3df361fdd095dbb2ace' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$fixture"
          chrome="$fixture/chrome-linux64/chrome"
          version="$("$chrome" --version | sed 's/[[:space:]]*$//')"
          test "$version" = 'Google Chrome for Testing 157.0.8092.0'
          printf 'ADTR_E2E_CHROMIUM_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
          {
            printf 'channel=Dev\nversion=%s\n' "$version"
            printf 'source_tag=2b9f0645d8f651a36f74683f22a3746379f13bc6\n'
            printf 'engine_fix=62473ad0f747e245e514c93e741bb8e168a2a207\n'
            sha256sum "$archive" web/e2e/native-no-store-completion.spec.ts web/e2e/native-stream-proof.ts web/e2e/user-assets-v2.spec.ts web/e2e/user-assets-v2-readers.spec.ts web/e2e/user-assets-v2-held-response.ts web/e2e/directory-v2-response-observer.ts web/src/directory-v2-json.ts
          } > "$fixture/provenance.txt"
          cat "$fixture/provenance.txt"
      - name: Require complete real user asset suite on fixed engine
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_auth_e2e.py --suite "${{ matrix.suite }}"
      - name: Retain fixed-engine real user asset evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.suite }}-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/user-assets-v2-*
            ${{ runner.temp }}/adtr-native-fixed/provenance.txt
          if-no-files-found: error
          retention-days: 7

  verify:
    if: ${{ always() }}
    needs: [prepare-postgres, contracts, auth-integration, browser, native-no-store, native-no-store-fixed, user-assets-fixed]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every contract and browser suite
        env:
          POSTGRES_RESULT: ${{ needs.prepare-postgres.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          AUTH_INTEGRATION_RESULT: ${{ needs.auth-integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          NATIVE_STREAM_RESULT: ${{ needs.native-no-store.result }}
          NATIVE_STREAM_FIXED_RESULT: ${{ needs.native-no-store-fixed.result }}
          USER_ASSETS_FIXED_RESULT: ${{ needs.user-assets-fixed.result }}
        run: test "$POSTGRES_RESULT" = success && test "$CONTRACT_RESULT" = success && test "$AUTH_INTEGRATION_RESULT" = success && test "$BROWSER_RESULT" = success && test "$NATIVE_STREAM_RESULT" = success && test "$NATIVE_STREAM_FIXED_RESULT" = success && test "$USER_ASSETS_FIXED_RESULT" = success
