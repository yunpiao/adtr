name: engineering-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify dependency checksums
        run: go mod verify
      - name: Lint, race tests, type checking and build
        run: make check
      - name: Real PostgreSQL migration and schema contracts
        run: python3 scripts/test_integration.py
      - name: API and Worker lifecycle
        run: python3 scripts/test_lifecycle.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: authentication
            command: python3 scripts/test_auth_e2e.py
          - name: expired-password
            command: python3 scripts/test_auth_e2e.py --expired
          - name: access
            command: python3 scripts/test_auth_e2e.py --suite access
          - name: resources
            command: python3 scripts/test_auth_e2e.py --suite resource
          - name: tasks
            command: python3 scripts/test_auth_e2e.py --suite tasks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real API and frontend
        run: go mod verify && make build web-build
      - name: Install real browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Run isolated real browser API database acceptance
        run: ${{ matrix.command }}
  verify:
    if: ${{ always() }}
    needs: [contracts, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every contract and browser suite
        env:
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CONTRACT_RESULT" = success && test "$BROWSER_RESULT" = success
