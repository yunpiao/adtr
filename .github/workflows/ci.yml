  native-no-store:
    if: ${{ needs.plan.outputs.native_no_store == 'true' }}
    needs: [plan]
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: stable-body
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser test dependencies
        run: npm ci --prefix web --cache /tmp/adtr-npm-cache
      - name: Install pinned Chromium and headed dependencies
        run: cd web && npx playwright install --with-deps chromium
      - name: Require complete application reads and record native outcomes
        run: xvfb-run -a npm run test:e2e --prefix web -- e2e/native-no-store-completion.spec.ts --headed
      - name: Validate both production readers and exact native evidence
        if: ${{ success() }}
        run: python3 scripts/validate_directory_v4_controls_evidence.py --source-root . --native
      - name: Retain synthetic native stream diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-no-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/native-no-store-completion.json
          if-no-files-found: error
          retention-days: 7

  native-no-store-fixed:
    if: ${{ needs.plan.outputs.native_no_store_fixed == 'true' }}
    needs: [plan]
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: native-finish
    # Isolated upstream-fix diagnostic; the pinned baseline and matrix stay intact.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser test dependencies
        run: npm ci --prefix web --cache /tmp/adtr-npm-cache
      - name: Install headed browser system dependencies
        run: cd web && npx playwright install-deps chromium
      - name: Verify official fixed-build diagnostic browser
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/adtr-native-fixed"
          mkdir -p "$fixture"
          archive="$fixture/chrome-linux64.zip"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 10 --max-time 180 \
            'https://storage.googleapis.com/chrome-for-testing-public/157.0.8092.0/linux64/chrome-linux64.zip' -o "$archive"
          test "$(stat -c %s "$archive")" -eq 201751736
          printf '%s  %s\n' '28d4f185c9047a91fe79ee8d31e5e0b5b858fc107129b3df361fdd095dbb2ace' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$fixture"
          chrome="$fixture/chrome-linux64/chrome"
          version="$("$chrome" --version | sed 's/[[:space:]]*$//')"
          test "$version" = 'Google Chrome for Testing 157.0.8092.0'
          printf 'ADTR_E2E_CHROMIUM_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
          {
            printf 'channel=Dev\nversion=%s\n' "$version"
            printf 'source_tag=2b9f0645d8f651a36f74683f22a3746379f13bc6\n'
            printf 'engine_fix=62473ad0f747e245e514c93e741bb8e168a2a207\n'
            sha256sum "$archive" web/e2e/native-no-store-completion.spec.ts web/e2e/native-stream-proof.ts web/e2e/user-assets-v2.spec.ts web/e2e/user-assets-v2-readers.spec.ts web/e2e/user-assets-v3.spec.ts web/e2e/computer-assets-v3.spec.ts web/e2e/computer-assets-v3-readers.spec.ts web/e2e/computer-assets-v3-fixture.ts web/e2e/computer-assets-v3-helpers.ts web/e2e/group-assets-v3.spec.ts web/e2e/group-assets-v3-readers.spec.ts web/e2e/group-assets-v3-fixture.ts web/e2e/group-assets-v3-helpers.ts web/e2e/user-assets-v2-held-response.ts web/e2e/directory-v2-response-observer.ts web/src/directory-v2-json.ts
          } > "$fixture/provenance.txt"
          cat "$fixture/provenance.txt"
      - name: Require identical native stream proof on the fixed engine
        run: xvfb-run -a npm run test:e2e --prefix web -- e2e/native-no-store-completion.spec.ts --headed
      - name: Validate both production readers and exact native evidence
        if: ${{ success() }}
        run: python3 scripts/validate_directory_v4_controls_evidence.py --source-root . --native
      - name: Retain fixed-build synthetic diagnostics and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-no-store-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/native-no-store-completion.json
            ${{ runner.temp }}/adtr-native-fixed/provenance.txt
          if-no-files-found: error
          retention-days: 7

  user-assets-fixed:
    if: ${{ needs.plan.outputs.user_assets_fixed == 'true' }}
    needs: [plan, prepare-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: native-finish
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.fixed_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real API and frontend
        run: go mod verify && make build web-build
      - name: Install browser system dependencies
        run: cd web && npx playwright install-deps chromium
      - name: Verify official fixed-build diagnostic browser
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/adtr-native-fixed"
          mkdir -p "$fixture"
          archive="$fixture/chrome-linux64.zip"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 10 --max-time 180 \
            'https://storage.googleapis.com/chrome-for-testing-public/157.0.8092.0/linux64/chrome-linux64.zip' -o "$archive"
          test "$(stat -c %s "$archive")" -eq 201751736
          printf '%s  %s\n' '28d4f185c9047a91fe79ee8d31e5e0b5b858fc107129b3df361fdd095dbb2ace' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$fixture"
          chrome="$fixture/chrome-linux64/chrome"
          version="$("$chrome" --version | sed 's/[[:space:]]*$//')"
          test "$version" = 'Google Chrome for Testing 157.0.8092.0'
          printf 'ADTR_E2E_CHROMIUM_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
          {
            printf 'channel=Dev\nversion=%s\n' "$version"
            printf 'source_tag=2b9f0645d8f651a36f74683f22a3746379f13bc6\n'
            printf 'engine_fix=62473ad0f747e245e514c93e741bb8e168a2a207\n'
            sha256sum "$archive" web/e2e/native-no-store-completion.spec.ts web/e2e/native-stream-proof.ts web/e2e/user-assets-v2.spec.ts web/e2e/user-assets-v2-readers.spec.ts web/e2e/user-assets-v3.spec.ts web/e2e/computer-assets-v3.spec.ts web/e2e/computer-assets-v3-readers.spec.ts web/e2e/computer-assets-v3-fixture.ts web/e2e/computer-assets-v3-helpers.ts web/e2e/group-assets-v3.spec.ts web/e2e/group-assets-v3-readers.spec.ts web/e2e/group-assets-v3-fixture.ts web/e2e/group-assets-v3-helpers.ts web/e2e/user-assets-v2-held-response.ts web/e2e/directory-v2-response-observer.ts web/src/directory-v2-json.ts
          } > "$fixture/provenance.txt"
          cat "$fixture/provenance.txt"
      - name: Require complete real user asset suite on fixed engine
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_auth_e2e.py --suite "${{ matrix.suite }}"
      - name: Validate safe failure diagnostics
        id: safe-diagnostics
        if: ${{ failure() }}
        run: python3 scripts/e2e_runtime_diagnostics.py .e2e-diagnostics .e2e-validated
      - name: Retain validated safe failure diagnostics
        if: ${{ failure() && steps.safe-diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-runtime-fixed-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-validated/diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain fixed-engine real user asset evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.suite }}-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/user-assets-v2-*
            web/test-results/**/user-assets-v3-*
            web/test-results/**/computer-assets-v3-*
            web/test-results/**/group-assets-v3-*
            ${{ runner.temp }}/adtr-native-fixed/provenance.txt
          if-no-files-found: error
          retention-days: 7

  verify:
    if: ${{ always() }}
    needs: [plan, prepare-postgres, contracts, auth-integration, browser, native-no-store, native-no-store-fixed, user-assets-fixed]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the same locked dependency parser for independent verification
        run: npm ci --prefix web --cache /tmp/adtr-npm-cache
      - name: Recompute immutable dependencies and require every selected check
        env:
          SELECTION_PLAN: ${{ needs.plan.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_selection_summary.py
