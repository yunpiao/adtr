name: engineering-ci
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions: {}
# setup-node, npm ci and npm audit must restore/use the same content cache.
env:
  npm_config_cache: /tmp/adtr-npm-cache
  ADTR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  ADTR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      prepare_postgres: ${{ steps.selection.outputs.prepare_postgres }}
      contracts: ${{ steps.selection.outputs.contracts }}
      auth_integration: ${{ steps.selection.outputs.auth_integration }}
      browser: ${{ steps.selection.outputs.browser }}
      native_no_store: ${{ steps.selection.outputs.native_no_store }}
      native_no_store_fixed: ${{ steps.selection.outputs.native_no_store_fixed }}
      user_assets_fixed: ${{ steps.selection.outputs.user_assets_fixed }}
      browser_matrix: ${{ steps.selection.outputs.browser_matrix }}
      fixed_matrix: ${{ steps.selection.outputs.fixed_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependency parser
        run: npm ci --prefix web --cache /tmp/adtr-npm-cache
      - name: Verify selection and dependency parser contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_selection_contract.py'
          node --test scripts/test_ci_dependencies.mjs
          python3 scripts/ci_selection.py --check-current
          python3 scripts/verify_requirements.py
      - name: Select immutable revision dependencies
        id: selection
        run: python3 scripts/ci_selection.py

  prepare-postgres:
    if: ${{ needs.plan.outputs.prepare_postgres == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.prepare.outputs.archive_sha256 }}
      producer_attempt: ${{ steps.prepare.outputs.producer_attempt }}
      checkout_sha: ${{ steps.prepare.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the exact PostgreSQL image once
        id: prepare
        run: python3 scripts/ci_postgres_image.py produce --directory "$RUNNER_TEMP/adtr-postgres"
      - name: Share the verified public image within this run
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adtr-postgres/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  contracts:
    if: ${{ needs.plan.outputs.contracts == 'true' }}
    needs: [plan, prepare-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify dependency checksums
        run: go mod verify
      - name: Verify fixed official Go build image identity
        id: go_image
        run: |
          evidence="$RUNNER_TEMP/adtr-go-image"
          mkdir -p "$evidence"
          status=0
          python3 scripts/verify_go_build_image.py --evidence-dir "$evidence" > "$evidence/verification.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$evidence/exit-code.txt"
          cat "$evidence/verification.log"
          exit "$status"
      - name: Retain Go build image verification evidence
        if: ${{ always() && (steps.go_image.outcome == 'success' || steps.go_image.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-build-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adtr-go-image
          if-no-files-found: error
          retention-days: 7
      - name: Lint, race tests, type checking and build
        run: make check
      - name: Real PostgreSQL migration and schema contracts
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_integration.py --suite non-auth
      - name: API and Worker lifecycle
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_lifecycle.py

  auth-integration:
    if: ${{ needs.plan.outputs.auth_integration == 'true' }}
    needs: [plan, prepare-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify dependency checksums
        run: go mod verify
      - name: Real PostgreSQL authentication and HTTP contracts
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/test_integration.py --suite auth --shard ${{ matrix.shard }}

  browser:
    if: ${{ needs.plan.outputs.browser == 'true' }}
    needs: [plan, prepare-postgres]
    env:
      ADTR_E2E_NATIVE_STREAM_MODE: ${{ (matrix.name == 'group-asset-export-v3-running-cancel' || matrix.name == 'computer-asset-export-v3-running-cancel' || matrix.name == 'user-asset-export-v3-running-cancel' || matrix.name == 'computer-asset-export-v3' || matrix.name == 'computer-asset-export-v3-failure' || matrix.name == 'computer-asset-export-v3-cancel' || matrix.name == 'group-asset-export-v3' || matrix.name == 'group-asset-export-v3-failure' || matrix.name == 'group-asset-export-v3-cancel' || matrix.name == 'user-asset-export-v3-failure' || matrix.name == 'user-asset-export-v3-cancel' || matrix.name == 'user-asset-export-v3' || matrix.name == 'user-assets-v2' || matrix.name == 'user-assets-v2-readers' || matrix.name == 'user-assets-v3' || matrix.name == 'computer-assets-v3' || matrix.name == 'computer-assets-v3-readers' || matrix.name == 'group-assets-v3' || matrix.name == 'group-assets-v3-readers') && 'stable-body' || 'native-finish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require explicit immutable producer outputs
        env:
          ARTIFACT_ID: ${{ needs.prepare-postgres.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Download this run's immutable PostgreSQL image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-postgres.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/adtr-postgres
      - name: Verify image provenance and load without a registry fallback
        env:
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: python3 scripts/ci_postgres_image.py consume --directory "$RUNNER_TEMP/adtr-postgres"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real API and frontend
        run: go mod verify && make build web-build
      - name: Install real browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Run isolated real browser API database acceptance
        env:
          ADTR_CI_POSTGRES_BUNDLE: ${{ runner.temp }}/adtr-postgres
          ADTR_CI_POSTGRES_ARCHIVE_SHA: ${{ needs.prepare-postgres.outputs.archive_sha256 }}
          ADTR_CI_POSTGRES_PRODUCER_ATTEMPT: ${{ needs.prepare-postgres.outputs.producer_attempt }}
        run: ${{ matrix.command }}
      - name: Validate safe failure diagnostics
        id: safe-diagnostics
        if: ${{ failure() }}
        run: python3 scripts/e2e_runtime_diagnostics.py .e2e-diagnostics .e2e-validated
      - name: Retain validated safe failure diagnostics
        if: ${{ failure() && steps.safe-diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-runtime-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-validated/diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Validate real empty asset observation evidence
        if: ${{ success() && matrix.name == 'directory-v3-controls' }}
        run: python3 scripts/validate_empty_asset_evidence.py --evidence-root web/test-results --source-root .
      - name: Retain validated empty asset observation evidence
        if: ${{ success() && matrix.name == 'directory-v3-controls' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: directory-v3-empty-assets-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/directory-v3-empty-assets-evidence.json
            web/test-results/**/directory-v3-empty-assets-no-observation-user-1440.png
            web/test-results/**/directory-v3-empty-assets-no-observation-user-390.png
            web/test-results/**/directory-v3-empty-assets-no-observation-computer-1440.png
            web/test-results/**/directory-v3-empty-assets-no-observation-computer-390.png
            web/test-results/**/directory-v3-empty-assets-no-observation-group-1440.png
            web/test-results/**/directory-v3-empty-assets-no-observation-group-390.png
            web/test-results/**/directory-v3-empty-assets-observed-empty-user-1440.png
            web/test-results/**/directory-v3-empty-assets-observed-empty-user-390.png
            web/test-results/**/directory-v3-empty-assets-observed-empty-computer-1440.png
            web/test-results/**/directory-v3-empty-assets-observed-empty-computer-390.png
            web/test-results/**/directory-v3-empty-assets-observed-empty-group-1440.png
            web/test-results/**/directory-v3-empty-assets-observed-empty-group-390.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic profile visual evidence
        if: ${{ success() && matrix.name == 'profile' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/viewer-profile.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic credential source visual evidence
        if: ${{ success() && matrix.name == 'account-references' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-source-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/source-unconfigured.png
            web/test-results/**/source-reference.png
            web/test-results/**/source-custom.png
            web/test-results/**/source-account-switch.png
            web/test-results/**/source-account-switch-transport.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic operational journal evidence
        if: ${{ success() && matrix.name == 'operational-logs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/production-journal-first-last.json
            web/test-results/**/operational-logs.png
          if-no-files-found: error
          retention-days: 7
      - name: Validate paginated group membership dictionary4 browser evidence
        if: ${{ success() && matrix.name == 'group-members-v4-pagination' }}
        run: python3 scripts/validate_group_members_v4_pagination_evidence.py --source-root .
      - name: Retain paginated group membership dictionary4 browser evidence
        if: ${{ always() && matrix.name == 'group-members-v4-pagination' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: group-members-v4-pagination-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/group-members-v4-pagination-evidence.json
            web/test-results/**/group-members-v4-pagination-reader-1440-discovery.png
            web/test-results/**/group-members-v4-pagination-reader-1440-next.png
            web/test-results/**/group-members-v4-pagination-reader-1440-detail.png
            web/test-results/**/group-members-v4-pagination-reader-1440-previous.png
            web/test-results/**/group-members-v4-pagination-reader-1440-size50.png
            web/test-results/**/group-members-v4-pagination-reader-1440-size25.png
            web/test-results/**/group-members-v4-pagination-reader-1440-reread.png
            web/test-results/**/group-members-v4-pagination-reader-390-discovery.png
            web/test-results/**/group-members-v4-pagination-reader-390-next.png
            web/test-results/**/group-members-v4-pagination-reader-390-detail.png
            web/test-results/**/group-members-v4-pagination-reader-390-previous.png
            web/test-results/**/group-members-v4-pagination-reader-390-size50.png
            web/test-results/**/group-members-v4-pagination-reader-390-size25.png
            web/test-results/**/group-members-v4-pagination-reader-390-reread.png
          # Strict success validation above requires JSON and all 14 step/viewport PNGs.
          # Keep partial failure evidence without masking the browser error.
          if-no-files-found: warn
          retention-days: 14
      - name: Validate computer export failure browser evidence
        id: computer-export-failure-evidence
        if: ${{ success() && matrix.name == 'computer-asset-export-v3-failure' }}
        run: python3 scripts/computer_asset_export_v3_terminal_ci.py validate --suite computer-asset-export-v3-failure
      - name: Retain validated computer export failure browser evidence
        if: ${{ success() && matrix.name == 'computer-asset-export-v3-failure' && steps.computer-export-failure-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-asset-export-v3-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/computer-asset-export-v3-failure-validated/computer-asset-export-v3-failure-provenance.json
            web/playwright-report/computer-asset-export-v3-failure-validated/computer-asset-export-v3-failure-evidence.json
            web/playwright-report/computer-asset-export-v3-failure-validated/failed-terminal.png
            web/playwright-report/computer-asset-export-v3-failure-validated/recovery-ready.png
            web/playwright-report/computer-asset-export-v3-failure-validated/computer-assets-v3-*.xlsx
          # Only validated synthetic JSON, explicit safe PNGs and actual recovery XLSX.
          if-no-files-found: error
          retention-days: 14
      - name: Validate computer export cancel browser evidence
        id: computer-export-cancel-evidence
        if: ${{ success() && matrix.name == 'computer-asset-export-v3-cancel' }}
        run: python3 scripts/computer_asset_export_v3_terminal_ci.py validate --suite computer-asset-export-v3-cancel
      - name: Retain validated computer export cancel browser evidence
        if: ${{ success() && matrix.name == 'computer-asset-export-v3-cancel' && steps.computer-export-cancel-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-asset-export-v3-cancel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/computer-asset-export-v3-cancel-validated/computer-asset-export-v3-cancel-provenance.json
            web/playwright-report/computer-asset-export-v3-cancel-validated/computer-asset-export-v3-cancel-evidence.json
            web/playwright-report/computer-asset-export-v3-cancel-validated/cancelled-terminal.png
          # Only validated synthetic JSON, explicit safe PNGs and actual recovery XLSX.
          if-no-files-found: error
          retention-days: 14
      - name: Validate computer asset export dictionary3 browser evidence
        id: computer-export-evidence
        if: ${{ success() && matrix.name == 'computer-asset-export-v3' }}
        run: python3 scripts/computer_asset_export_v3_ci.py validate
      - name: Retain validated computer asset export dictionary3 browser evidence
        if: ${{ success() && matrix.name == 'computer-asset-export-v3' && steps.computer-export-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-asset-export-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/computer-export-validated/computer-asset-export-v3-provenance.json
            web/playwright-report/computer-export-validated/computer-asset-export-v3-evidence.json
            web/playwright-report/computer-export-validated/computer-assets-v3-*.xlsx
            web/playwright-report/computer-export-validated/default-ready.png
            web/playwright-report/computer-export-validated/allMatched-ready.png
            web/playwright-report/computer-export-validated/empty-ready.png
          # No trace, videos, logs, storage state, credentials or raw failures.
          # Only independently validated synthetic JSON, XLSX and safe PNGs.
          if-no-files-found: error
          retention-days: 14
      - name: Validate group export failure browser evidence
        id: group-export-failure-evidence
        if: ${{ success() && matrix.name == 'group-asset-export-v3-failure' }}
        run: python3 scripts/group_asset_export_v3_terminal_ci.py validate --suite group-asset-export-v3-failure
      - name: Retain validated group export failure browser evidence
        if: ${{ success() && matrix.name == 'group-asset-export-v3-failure' && steps.group-export-failure-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: group-asset-export-v3-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/group-asset-export-v3-failure-validated/group-asset-export-v3-failure-provenance.json
            web/playwright-report/group-asset-export-v3-failure-validated/group-asset-export-v3-failure-evidence.json
            web/playwright-report/group-asset-export-v3-failure-validated/failed-terminal.png
            web/playwright-report/group-asset-export-v3-failure-validated/recovery-ready.png
            web/playwright-report/group-asset-export-v3-failure-validated/group-assets-v3-*.xlsx
