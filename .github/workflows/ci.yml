name: engineering-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify dependency checksums
        run: go mod verify
      - name: Lint, race tests, type checking and build
        run: make check
      - name: Real PostgreSQL migration and schema contracts
        run: python3 scripts/test_integration.py
      - name: API and Worker lifecycle
        run: python3 scripts/test_lifecycle.py

      - name: Install browser for real authentication acceptance
        run: cd web && npx playwright install --with-deps chromium
      - name: Real browser authentication lifecycle
        run: python3 scripts/test_auth_e2e.py
      - name: Expired password real browser lifecycle
        run: python3 scripts/test_auth_e2e.py --expired
      - name: Real user role and permission browser lifecycle
        run: python3 scripts/test_auth_e2e.py --suite access
      - name: Real resource isolation browser lifecycle
        run: python3 scripts/test_auth_e2e.py --suite resource
      - name: Real task API Worker and database browser lifecycle
        run: python3 scripts/test_auth_e2e.py --suite tasks
