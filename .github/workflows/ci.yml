name: engineering-ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify dependency checksums
        run: go mod verify
      - name: Lint, race tests, type checking and build
        run: make check
      - name: Real PostgreSQL migration and schema contracts
        run: python3 scripts/test_integration.py --suite non-auth
      - name: API and Worker lifecycle
        run: python3 scripts/test_lifecycle.py

  auth-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify dependency checksums
        run: go mod verify
      - name: Real PostgreSQL authentication and HTTP contracts
        run: python3 scripts/test_integration.py --suite auth --shard ${{ matrix.shard }}

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: user-assets-v2
            command: python3 scripts/test_auth_e2e.py --suite user-assets-v2
          - name: user-assets-v2-readers
            command: python3 scripts/test_auth_e2e.py --suite user-assets-v2-readers
          - name: directory-v2
            command: python3 scripts/test_auth_e2e.py --suite directory-v2
          - name: directory-v2-controls
            command: python3 scripts/test_auth_e2e.py --suite directory-v2-controls
          - name: directory-v2-readers
            command: python3 scripts/test_auth_e2e.py --suite directory-v2-readers
          - name: directory-readers
            command: python3 scripts/test_auth_e2e.py --suite directory-readers
          - name: authentication
            command: python3 scripts/test_auth_e2e.py
          - name: expired-password
            command: python3 scripts/test_auth_e2e.py --expired
          - name: access
            command: python3 scripts/test_auth_e2e.py --suite access
          - name: resources
            command: python3 scripts/test_auth_e2e.py --suite resource
          - name: tasks
            command: python3 scripts/test_auth_e2e.py --suite tasks
          - name: audit
            command: python3 scripts/test_auth_e2e.py --suite audit
          - name: system
            command: python3 scripts/test_auth_e2e.py --suite system
          - name: maintenance
            command: python3 scripts/test_auth_e2e.py --suite maintenance
          - name: domains
            command: python3 scripts/test_auth_e2e.py --suite domains
          - name: operations
            command: python3 scripts/test_auth_e2e.py --suite operations
          - name: profile
            command: python3 scripts/test_auth_e2e.py --suite profile
          - name: credential-use
            command: python3 scripts/test_auth_e2e.py --suite credential-use
          - name: account-references
            command: python3 scripts/test_auth_e2e.py --suite account-references
          - name: operational-logs
            command: python3 scripts/test_auth_e2e.py --suite operational-logs
          - name: session-invalidation
            command: python3 scripts/test_auth_e2e.py --suite session-invalidation
          - name: account-reference-barrier
            command: python3 scripts/test_auth_e2e.py --suite account-reference-barrier
          - name: directory
            command: python3 scripts/test_auth_e2e.py --suite directory
          - name: directory-controls
            command: python3 scripts/test_auth_e2e.py --suite directory-controls
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build real API and frontend
        run: go mod verify && make build web-build
      - name: Install real browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Run isolated real browser API database acceptance
        run: ${{ matrix.command }}
      - name: Retain synthetic profile visual evidence
        if: ${{ success() && matrix.name == 'profile' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/viewer-profile.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic credential source visual evidence
        if: ${{ success() && matrix.name == 'account-references' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-source-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/source-unconfigured.png
            web/test-results/**/source-reference.png
            web/test-results/**/source-custom.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic operational journal evidence
        if: ${{ success() && matrix.name == 'operational-logs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/**/production-journal-first-last.json
            web/test-results/**/operational-logs.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic user asset evidence
        if: ${{ success() && (matrix.name == 'user-assets-v2' || matrix.name == 'user-assets-v2-readers') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results/**/user-assets-v2-*
          if-no-files-found: error
          retention-days: 7
  verify:
    if: ${{ always() }}
    needs: [contracts, auth-integration, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every contract and browser suite
        env:
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          AUTH_INTEGRATION_RESULT: ${{ needs.auth-integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CONTRACT_RESULT" = success && test "$AUTH_INTEGRATION_RESULT" = success && test "$BROWSER_RESULT" = success
